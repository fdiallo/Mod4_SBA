<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Mod 4 Lab 2</title>
</head>

<body>
    <section id="task">
        <h2>Task Management App</h2>
        <hr><br><br>
        <label for="name">Task Name</label><br>
        <input id="inputTaskName" type="text" placeholder="Enter name" aria-required="required"><br><br>
        <label for="category">Task Category</label><br>
        <input id="inputTaskCategory" type="text" placeholder="Enter category" aria-required="required"><br><br>

        <label for="deadline">Task Deadline </label><br>
        <input id="inputTaskDeadline" type="date" placeholder="Task Deadline" min="2026-01-00" max="2026-12-31"
            aria-required="required" /><br><br>

        <label for="status">Status</label><br>
        <select id="inputTaskStatus">
            <option value="Progress">Progress</option>
            <option value="Completed">Completed</option>
            <option value="Overdue">Overdue</option>
        </select><br><br>

        <br><br> <button id="btnAddTask">Add Task</button>
        <button id="btnRemoveLastTask">Remove Last Task</button>
        <button id="btnUpdateTask">Update A Task</button>


        <ul id="list"></ul>

    </section>
</body>

</html>
